<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      #week {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 8px;
        padding: 8px 0;
      }

      #week .card {
        aspect-ratio: 1;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        text-align: center;
        font-family: system-ui, sans-serif;
      }

      #week .card.inactive {
        background: #f4f4f4;
        border-color: #e5e5e5;
        color: #bbb;
      }

      #week .card h3 {
        margin: 0;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: .05em;
        color: #666;
      }

      #week .card.inactive h3 { color: inherit; }
      #week .card h4 { margin: 0; font-size: 14px; }
      #week .card button { font-size: 12px; cursor: pointer; }

      #recipebox {
        position: absolute;
        background: #ffecec;
        border: solid 1px black;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Recipe Box</h1>
    <div id="recipebox" style="display: block;"></div>
    <div id="week"></div>
  </body>
</html>

<script>
  function renderWeek(weekHtml) {
    var weekDisplay = document.getElementById('week');
    weekDisplay.innerHTML = weekHtml;
  }

  function load(reloading) {
    // TODO: Render Recipe box
    
    google.script.run.withSuccessHandler(
      (w) => {
        renderWeek(w)
      }
    ).createWeekLayout();
  }

  load()
</script>
