<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      #week {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 8px;
        padding: 8px 0;
      }

      #week .card {
        aspect-ratio: 1;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        text-align: center;
        font-family: system-ui, sans-serif;
      }

      #week .card.inactive {
        background: #f4f4f4;
        border-color: #e5e5e5;
        color: #bbb;
      }

      #week .card h3 {
        margin: 0;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: .05em;
        color: #666;
      }

      #week .card.inactive h3 { color: inherit; }
      #week .card h4 { margin: 0; font-size: 14px; }
      #week .card button { font-size: 12px; cursor: pointer; }

      #recipebox {
        position: absolute;
        background: #ffecec;
        border: solid 1px black;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Recipe Box</h1>
    <div id="recipebox" style="display: none;"></div>
    <div id="week"></div>
  </body>
</html>

<script>
  let state = {selectedDate: null};

  function showRecipePopup(e) {
    var box = document.getElementById('recipebox');

    box.style.display = 'block';
    box.style.left = e.pageX + 'px';
    box.style.top = (Math.max(e.pageY - box.offsetHeight, 0)) + 'px';
  }

  function scheduleRecipe(e) {
    const button = e.currentTarget;
    console.log(button);
    console.log("schedule recipe", button.dataset.recipeName, 'on date', state.selectedDate);
    google.script.run.withSuccessHandler(
      () => {
        console.log('yeah, its scheduled!');
        hideRecipePopup();
        load(true);
      }
    ).scheduleRecipeOnCalendar(button.dataset.recipeName, state.selectedDate);
  }

  function hideRecipePopup() {
    document.getElementById('recipebox').style.display = 'none';
  }

  document.addEventListener('click', function (e) {
    if (!e.target.closest('#recipebox')) {
      hideRecipePopup();
    }
  });

  function renderRecipesPopup(recipeHtml) {
    var recipeBox = document.getElementById('recipebox');
    recipeBox.innerHTML = recipeHtml;

    var buttons = recipeBox.querySelectorAll('button.schedule-recipe');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].addEventListener('click', (e) => {
        e.stopPropagation();
        if (state.selectedDate) {
          console.log('gonna schedule on', state.selectedDate)
          scheduleRecipe(e);
        } else {
          console.log('could not schedule');
        }
      });
    }
  }

  function renderWeek(weekHtml) {
    var weekDisplay = document.getElementById('week');
    weekDisplay.innerHTML = weekHtml;

    var buttons = weekDisplay.querySelectorAll('button.open-recipe-box');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].addEventListener('click', function (e) {
        const scheduleButton = e.currentTarget;
        state.selectedDate = scheduleButton.dataset.timestamp;
        e.stopPropagation();
        showRecipePopup(e);
      });
    }
  }

  function load(reloading) {
    if (!reloading) {
      document.getElementById('recipebox').innerHTML = 'Loading';
      google.script.run.withSuccessHandler(
        (r) => {
          renderRecipesPopup(r)
        }
      ).createRecipeListLayout();

      document.getElementById('week').innerHTML = 'Loading';
    }
    

    google.script.run.withSuccessHandler(
      (w) => {
        renderWeek(w)
      }
    ).createWeekLayout();
  }

  load();
</script>
